<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletas de Pago</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --strawberry-red: #FF4B5F;
      --matcha-green: #46C3AF;
      --blueberry-blue: #5B94B7;
    }
    
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f8f5ec;
      padding: 30px;
      color: #333;
      margin: 0;
    }
    
    .content-wrapper {
      display: none;
    }
    
    .content-wrapper.active {
      display: block;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      .output, .output * {
        visibility: visible;
      }
      .output {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      @page {
        margin: 0;
        size: A4;
      }
      body {
        margin: 0 !important;
        padding: 0 !important;
        page-break-after: avoid !important;
      }
    }
    
    h1 {
      text-align: center;
      color: #2f006e;
    }
    
    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    
    .logo img {
      width: 160px;
    }
    
    section {
      background: #D5C3E8;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    
    label {
      font-weight: 500;
      display: block;
      margin-bottom: 4px;
    }
    
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    
    .input-small {
      width: 40%;
      min-width: 200px;
    }
    
    button {
      background-color: #2f006e;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 0 auto;
      display: block;
      transition: all 0.3s ease;
    }
    
    button:hover {
      background-color: #4a148c;
      transform: translateY(-2px);
    }
    
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .button-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .button-group button {
      display: inline-block;
      margin: 0;
    }
    
    #resultado {
      display: none;
      max-width: 900px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    
    .step-red {
      background-color: var(--strawberry-red);
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .step-green {
      background-color: var(--matcha-green);
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .step-blue {
      background-color: var(--blueberry-blue);
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    #botonPdf {
      text-align: center;
      display: none;
      max-width: 900px;
      margin: 30px auto 0;
    }

    #btnEnviarDirecto {
      display: none;
      background-color: #2196F3;
      margin-top: 20px;
    }

    #btnEnviarDirecto:hover {
      background-color: #0b7dda;
    }
  </style>
</head>
<body>

  <div id="mainContent" class="content-wrapper active">

    <div style="text-align: center; margin-bottom: 20px;">
      <img src="Logo.png" alt="Logo" style="max-width: 200px;">
      <h2>Boletas de pago Oakberry</h2>
    </div>

    <input type="hidden" id="nombre_envio">
    <input type="hidden" id="apellido_envio">
    <input type="hidden" id="cedula_envio">
    <input type="hidden" id="correo_envio">
    <input type="hidden" id="restaurante_envio">
    <input type="hidden" id="consecutivo_envio">
    <input type="hidden" id="accion_modal">
    <input type="hidden" id="pais_modal">

    <!-- FORMULARIO PRINCIPAL -->
    <form id="boletaForm">
      <!-- EMPRESA -->
      <section>
        <div class="step-red">
          <h2>PASO 1 DE 3 — Empresa</h2>
        </div>
        <div class="grid">
          <div>
            <label>Nombre de empresa</label>
            <select id="empresa" onchange="autocompletarEmpresa()">
              <option value="">Seleccione...</option>
              <option value="ACAI OAK RESTAURANTES S.A">ACAI OAK RESTAURANTES S.A</option>
              <option value="OAKBERRY PANAMA S.A">OAKBERRY PANAMA S.A</option>
              <option value="OAKBERRY GUATEMALA S.A">OAKBERRY GUATEMALA S.A</option>
              <option value="OAKBERRY EL SALVADOR S.A">OAKBERRY EL SALVADOR S.A</option>
            </select>
          </div>
          <div>
            <label for="correo_empresa">Correo electrónico de la empresa</label>
            <input type="email" id="correo_empresa">
          </div>
          <div>
            <label>Dirección</label>
            <input type="text" id="direccionEmpresa" readonly>
          </div>
          <div>
            <label>País</label>
            <input type="text" id="paisEmpresa" readonly>
          </div>
          <div>
            <label>Cédula jurídica</label>
            <input type="text" id="cedulaEmpresa" readonly>
          </div>
          <div>
            <label>Divisa</label>
            <select id="moneda" disabled>
              <option value="₡">Colones costarricenses (CRC)</option>
              <option value="$">Dólares (USD)</option>
              <option value="Q">Quetzal</option>
            </select>
          </div>
        </div>
      </section>

      <!-- EMPLEADO -->
      <section>
        <div class="step-green">
          <h2>PASO 2 DE 3 — Empleado</h2>
        </div>
        <div class="grid">
          <div>
            <label>Nombre</label>
            <input type="text" id="nombreEmpleado" readonly>
          </div>
          <div>
            <label>Apellido</label>
            <input type="text" id="apellidoEmpleado" readonly>
          </div>
          <div>
            <label>Cédula / ID</label>
            <input type="text" id="idEmpleado" readonly>
          </div>
          <div>
            <label for="correoEmpleado">Correo electrónico del colaborador</label>
            <input type="email" id="correoEmpleado" readonly>
          </div>
          <div>
            <label>Consecutivo</label>
            <input type="text" id="consecutivo" readonly>
          </div>
        </div>
        <div>
          <label>Restaurante en el que labora</label>
          <input type="text" id="restaurante" readonly>
        </div>
      </section>

      <!-- INGRESOS -->
      <section>
        <div class="step-blue">
          <h2>PASO 3 DE 3 — Ingresos</h2>
        </div>
        <div class="grid">
          <div>
            <label>Fecha de pago</label>
            <input type="date" id="fechaPago" class="input-small">
          </div>
        </div>
        <div class="form-group">
          <label for="fecha_festivo">Fecha de día festivo (opcional):</label>
          <input type="date" id="fecha_festivo" class="input-small">
        </div>
        <div class="grid">
          <div>
            <label for="salario">Salario bruto mensual</label>
            <input type="text" id="salario" placeholder="0" inputmode="decimal" oninput="calculateExtrasAndFestivos()" style="width: 40% !important;">
          </div>
        </div>
        <div class="form-group">
          <label for="diasLaborados">Días laborados:</label>
          <input type="number" id="diasLaborados" placeholder="Días" step="any" min="0" style="width: 40% !important;" oninput="calculateExtrasAndFestivos()">
        </div>
        
        <!-- Horas extra -->
        <div style="grid-column: 1/-1;">
          <div style="display: flex; gap: 10px;">
            <div>
              <label>Horas extra</label>
              <input type="number" placeholder="Cantidad" id="horasExtraCantidad" oninput="calculateExtrasAndFestivos()">
            </div>
            <div>
              <label>&nbsp;</label>
              <input type="text" placeholder="Monto" id="horasExtraMonto" readonly style="background: #f5f5f5;">
            </div>
          </div>
        </div>
        
        <!-- Día festivo / Extra -->
        <div style="grid-column: 1/-1;">
          <div style="display: flex; gap: 10px;">
            <div>
              <label>Día festivo / Extra</label>
              <input type="number" placeholder="Cantidad" id="festivoCantidad" oninput="calculateExtrasAndFestivos()">
            </div>
            <div>
              <label>&nbsp;</label>
              <input type="text" placeholder="Monto" id="festivoMonto" readonly style="background: #f5f5f5;">
            </div>
          </div>
        </div>

        <!-- Deducciones dinámicas -->
        <div style="grid-column: 1/-1;">
          <label>Deducciones</label>
          <div id="deduccionesContainer"></div>
          <button type="button" onclick="agregarDeduccion()" style="margin-bottom:10px;">+ Añadir deducción</button>
        </div>
        
        <!-- Otros Ingresos dinámicas -->
        <div style="grid-column: 1/-1;">
          <label>Otros Ingresos</label>
          <div id="bonificacionesContainer"></div>
          <button type="button" onclick="agregarBonificacion()" style="margin-bottom:10px;">+ Añadir bonificación</button>
        </div>
        
        <!-- BOTONES DE GENERACIÓN -->
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
          <button type="button" id="btnGenerarCR" onclick="generarBoletaCR()" style="display:none;">
            📄 Generar boleta CR
          </button>
          <button type="button" id="btnGenerarPanama" onclick="generarBoletaPanama()" style="display:none;">
            📄 Generar boleta Panamá
          </button>
        </div>
      </section>
    </form>

    <!-- NOTA U OBSERVACIÓN -->
    <div class="step">
      <h2>Nota u Observación</h2>
      <label>Comentario adicional (opcional):</label>
      <textarea id="nota" rows="3" style="width: 100%; border-radius: 5px; padding: 8px; border: 1px solid #ccc; max-width: 900px; margin: 0 auto 15px;"></textarea>
    </div>
    
    <!-- RESULTADO -->
    <div id="boleta">
      <div id="comprobantePDF">
        <div id="recibo" class="output" style="background-color:#f9f6f1; margin:0 !important; padding:0 !important; min-height:auto !important; height:auto !important;">
          <div style="text-align: center; margin-bottom: 10px;">
            <img src="Logo.png" alt="Logo" style="max-height: 80px;"><br>
          </div>
        </div>
      </div>
    </div>
    
    <!-- BOTONES DE RESULTADO -->
    <div id="botonPdf">
      <div class="button-group">
        <button type="button" onclick="imprimirBoleta()">🖨️ Imprimir</button>
        <button type="button" onclick="enviarBoleta()">📧 Enviar Boleta</button>
      </div>
    </div>

    <!-- BOTÓN ENVÍO DIRECTO (desde modal) -->
    <button id="btnEnviarDirecto" onclick="enviarBooletaDirecta()">
      📧 Enviar Boleta por Email
    </button>

  </div>

  <script>
    const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxuuNqigAcPRoFpN4roDhJbWMejbYs3WrGfWsntxT9EFZyN3GBhvN_13Ccx9LiHG722/exec';

    // ========== CARGAR DATOS DESDE URL (CUANDO VIENE DE LA PLANILLA) ==========
    function cargarDatosDelModal() {
      const params = new URLSearchParams(window.location.search);
      const dataParam = params.get('data');
      
      if (!dataParam) return; // No viene de modal
      
      try {
        const colaborador = JSON.parse(decodeURIComponent(dataParam));
        
        // Guardamos la acción
        document.getElementById('accion_modal').value = colaborador.accion || '';
        document.getElementById('pais_modal').value = colaborador.pais || '';
        
        // Autocompletar empresa
        const empresa = colaborador.pais === 'cr' 
          ? 'ACAI OAK RESTAURANTES S.A' 
          : 'OAKBERRY PANAMA S.A';
        document.getElementById('empresa').value = empresa;
        autocompletarEmpresa();
        
        // Autocompletar empleado
        document.getElementById('nombreEmpleado').value = colaborador.nombre || '';
        document.getElementById('apellidoEmpleado').value = '';
        document.getElementById('idEmpleado').value = '';
        document.getElementById('correoEmpleado').value = '';
        document.getElementById('restaurante').value = colaborador.restaurante || '';
        
        // Guardar para envío
        document.getElementById('nombre_envio').value = colaborador.nombre || '';
        document.getElementById('correo_envio').value = '';
        
        // Rellenar salario
        if (colaborador.salarioBruto) {
          document.getElementById('salario').value = colaborador.salarioBruto.toLocaleString('es-CR');
        }
        
        // Establecer fecha de pago a hoy
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('fechaPago').value = hoy;
        
        // Generar consecutivo
        generarConsecutivoAuto();
        
        // Si es para envío directo, mostrar botón especial
        if (colaborador.accion === 'enviar') {
          document.getElementById('btnEnviarDirecto').style.display = 'block';
          document.getElementById('botonPdf').style.display = 'none';
        }
        
      } catch (error) {
        console.error('Error al cargar datos del modal:', error);
      }
    }

    function generarConsecutivoAuto() {
      let consecutivo = localStorage.getItem('consecutivoBoleta');
      if (!consecutivo) {
        consecutivo = 1;
      } else {
        consecutivo = parseInt(consecutivo) + 1;
      }
      localStorage.setItem('consecutivoBoleta', consecutivo);
      document.getElementById('consecutivo').value = consecutivo;
      document.getElementById('consecutivo_envio').value = consecutivo;
    }

    function autocompletarEmpresa() {
      const empresa = document.getElementById("empresa").value;
      const pais = document.getElementById("paisEmpresa");
      const direccion = document.getElementById("direccionEmpresa");
      const moneda = document.getElementById("moneda");
      const cedula = document.getElementById("cedulaEmpresa");
      
      const btnCR = document.getElementById("btnGenerarCR");
      const btnPanama = document.getElementById("btnGenerarPanama");

      switch (empresa) {
        case "ACAI OAK RESTAURANTES S.A":
          pais.value = "Costa Rica";
          direccion.value = "800 Norte Del Bac, Ruta Nacional Treciaria 310, San José, San Rafael";
          moneda.value = "₡";
          cedula.value = "3 101 902500";
          btnCR.style.display = "block";
          btnPanama.style.display = "none";
          break;
        case "OAKBERRY PANAMA S.A":
          pais.value = "Panamá";
          direccion.value = "Edificio Scotia Plaza, Piso 11, Panamá";
          moneda.value = "$";
          cedula.value = "155754321-2-2024";
          btnCR.style.display = "none";
          btnPanama.style.display = "block";
          break;
        case "OAKBERRY GUATEMALA S.A":
          pais.value = "Guatemala";
          direccion.value = "Diagonal 6, 10-50, zona 10, Guatemala";
          moneda.value = "Q";
          cedula.value = "0623-200325-115-2";
          btnCR.style.display = "none";
          btnPanama.style.display = "none";
          break;
        case "OAKBERRY EL SALVADOR S.A":
          pais.value = "El Salvador";
          direccion.value = "Edificio Millenium, Piso 21, Oficina 28";
          moneda.value = "$";
          cedula.value = "";
          btnCR.style.display = "none";
          btnPanama.style.display = "none";
          break;
        default:
          pais.value = "";
          direccion.value = "";
          cedula.value = "";
          btnCR.style.display = "none";
          btnPanama.style.display = "none";
      }
    }

    function parseCurrency(value) {
      return parseFloat((value || '0').toString().replace(/[^\d.]/g, '')) || 0;
    }

    function calculateExtrasAndFestivos() {
      const salarioBruto = parseCurrency(document.getElementById('salario').value);
      const diasLaborados = parseCurrency(document.getElementById('diasLaborados').value);
      const horasExtra = parseCurrency(document.getElementById('horasExtraCantidad').value);
      const festivoCantidad = parseCurrency(document.getElementById('festivoCantidad').value);

      const salarioOrdinario = (salarioBruto / 30) * diasLaborados;
      const salarioDiario = diasLaborados > 0 ? (salarioOrdinario / diasLaborados) : 0;
      const salarioHora = salarioDiario / 8;
      const montoExtra = horasExtra * salarioHora * 1.5;
      const montoFestivo = festivoCantidad * salarioDiario * 2;

      document.getElementById('horasExtraMonto').value = isNaN(montoExtra) ? '' : Math.round(montoExtra).toLocaleString('es-CR');
      document.getElementById('festivoMonto').value = isNaN(montoFestivo) ? '' : Math.round(montoFestivo).toLocaleString('es-CR');
    }

    function agregarDeduccion() {
      const container = document.getElementById('deduccionesContainer');
      const div = document.createElement('div');
      div.className = 'deduccion-row';
      div.style.display = 'flex';
      div.style.gap = '8px';
      div.style.marginBottom = '8px';
      div.innerHTML = `
        <input type="text" class="detalle-deduccion" placeholder="Descripción" style="flex:2;">
        <input type="text" class="monto-deduccion" placeholder="Monto" style="flex:1;" inputmode="decimal">
        <button type="button" onclick="this.parentNode.remove();" style="padding: 8px 12px;">🗑️</button>
      `;
      container.appendChild(div);
    }
    
    function agregarBonificacion() {
      const container = document.getElementById('bonificacionesContainer');
      const div = document.createElement('div');
      div.className = 'bonificacion-row';
      div.style.display = 'flex';
      div.style.gap = '8px';
      div.style.marginBottom = '8px';
      div.innerHTML = `
        <input type="text" class="detalle-bonificacion" placeholder="Descripción" style="flex:2;">
        <input type="text" class="monto-bonificacion" placeholder="Monto" style="flex:1;" inputmode="decimal">
        <button type="button" onclick="this.parentNode.remove();" style="padding: 8px 12px;">🗑️</button>
      `;
      container.appendChild(div);
    }

    // ========== GENERAR BOLETA COSTA RICA ==========
    function generarBoletaCR() {
      const empresa = document.getElementById("empresa").value || '';
      const cedulaEmpresa = document.getElementById("cedulaEmpresa").value || '';
      const nombreColab = document.getElementById("nombreEmpleado").value || '';
      const cedulaColab = document.getElementById("idEmpleado").value || '';
      
      const rawFecha = document.getElementById("fechaPago").value || '';
      let fechaPago = "";
      if (rawFecha) {
        const [a, m, d] = rawFecha.split("-");
        fechaPago = `${d}/${m}/${a.slice(2)}`;
      }
      
      const diasLaborados = parseFloat(
        (document.getElementById("diasLaborados").value || "0").replace(/[^\d.]/g, '')
      ) || 0;
      
      const salario = parseCurrency(document.getElementById('salario').value);
      
      const salarioDiario = salario / 30;
      const salarioOrdinario = salarioDiario * diasLaborados;
      
      const horasExtra = parseFloat(document.getElementById("horasExtraCantidad").value || "0") || 0;
      const festivos = parseFloat(document.getElementById("festivoCantidad").value || "0") || 0;
      
      const montoExtra = (salarioDiario / 8) * 1.5 * horasExtra;
      const montoFestivo = (salario / 30) * festivos * 2;
      
      let totalDeducciones = 0;
      let deduccionesHTML = '';
      document.querySelectorAll('.deduccion-row').forEach(row => {
        const descripcion = row.querySelector('.detalle-deduccion')?.value || '';
        const monto = row.querySelector('.monto-deduccion')?.value || '0';
        if (descripcion && monto) {
          const montoLimpio = parseCurrency(monto);
          totalDeducciones += montoLimpio;
          deduccionesHTML += `
            <tr>
              <td style="padding:4px 5px;">${descripcion}</td>
              <td style="text-align:center; padding:4px 5px;"></td>
              <td style="text-align:right; padding:4px 5px;">₡${Math.round(montoLimpio).toLocaleString('es-CR')}</td>
            </tr>
          `;
        }
      });
      
      let totalOtrosIngresos = 0;
      let otrosIngresosDetalle = '';
      document.querySelectorAll('.bonificacion-row').forEach(row => {
        const descripcion = row.querySelector('.detalle-bonificacion')?.value?.trim();
        const montoStr = row.querySelector('.monto-bonificacion')?.value?.trim();
        const montoLimpio = parseCurrency(montoStr);
        if (descripcion && montoLimpio) {
          totalOtrosIngresos += montoLimpio;
          otrosIngresosDetalle += `
            <tr>
              <td style="padding:4px 5px;">${descripcion}</td>
              <td style="text-align:center; padding:4px 5px;">${fechaPago}</td>
              <td style="text-align:right; padding:4px 5px;">₡${Math.round(montoLimpio).toLocaleString('es-CR')}</td>
            </tr>
          `;
        }
      });
      
      const baseCCSS = salarioOrdinario + montoExtra + montoFestivo;
      const deduccionCCSS = Math.floor(baseCCSS * 0.1083);
      const salarioBrutoTotal = salarioOrdinario + montoExtra + montoFestivo + totalOtrosIngresos;
      const salarioNeto = Math.round(salarioBrutoTotal - deduccionCCSS - totalDeducciones);
      
      const resultadoHTML = `
        <div style="max-width:530px; margin:0 auto; font-family:'Segoe UI',sans-serif; background:#fff; border-radius:10px; border:1px solid #ccc; padding:32px 24px 28px 24px; box-shadow:0 2px 8px rgba(0,0,0,0.07); page-break-inside:avoid;">
          <div style="text-align:center; margin-bottom:18px;">
            <div style="font-size: 30px; font-weight: bold; color: #4B0082; margin-bottom: 8px;">OAKBERRY</div>
            <span style="font-size:22px; font-weight:700; color:#2f006e;">COMPROBANTE DE PAGO</span>
          </div>
          <table style="width:100%; margin-bottom:12px; border:none; font-size:15px;">
            <tr>
              <td style="font-weight:600;">Empresa:</td>
              <td>${empresa}</td>
            </tr>
            <tr>
              <td style="font-weight:600;">Cédula jurídica:</td>
              <td>${cedulaEmpresa}</td>
            </tr>
            <tr>
              <td style="font-weight:600;">Colaborador:</td>
              <td>${nombreColab}</td>
            </tr>
            <tr>
              <td style="font-weight:600;">Cédula:</td>
              <td>${cedulaColab}</td>
            </tr>
            <tr>
              <td style="font-weight:600;">Fecha de pago:</td>
              <td>${fechaPago}</td>
            </tr>
          </table>
          <table style="width:100%; border-collapse:collapse; font-size:15px; margin-bottom:18px;">
            <thead>

    // ========== GENERAR BOLETA PANAMÁ ==========
    function generarBoletaPanama() {
      const empresa = document.getElementById("empresa").value || '';
      const cedulaEmpresa = document.getElementById("cedulaEmpresa").value || '';
      const nombreColab = document.getElementById("nombreEmpleado").value || '';
      const cedulaColab = document.getElementById("idEmpleado").value || '';
      
      const rawFecha = document.getElementById("fechaPago").value || '';
      let fechaPago = "";
      if (rawFecha) {
        const [a, m, d] = rawFecha.split("-");
        fechaPago = `${d}/${m}/${a.slice(2)}`;
      }
      
      const diasLaborados = parseFloat(
        (document.getElementById("diasLaborados").value || "0").replace(/[^\d.]/g, '')
      ) || 0;
      
      const salario = parseCurrency(document.getElementById('salario').value);
      const salarioDiario = salario / 30;
      const salarioOrdinario = salarioDiario * diasLaborados;
      
      const horasExtra = parseFloat(document.getElementById("horasExtraCantidad").value || "0") || 0;
      const festivos = parseFloat(document.getElementById("festivoCantidad").value || "0") || 0;
      
      const montoExtra = (salarioDiario / 8) * 1.5 * horasExtra;
      const montoFestivo = (salario / 30) * festivos * 2;
      
      let totalDeducciones = 0;
      let deduccionesHTML = '';
      document.querySelectorAll('.deduccion-row').forEach(row => {
        const descripcion = row.querySelector('.detalle-deduccion')?.value || '';
        const monto = row.querySelector('.monto-deduccion')?.value || '0';
        if (descripcion && monto) {
          const montoLimpio = parseCurrency(monto);
          totalDeducciones += montoLimpio;
          deduccionesHTML += `
            <tr>
              <td style="padding:4px 5px;">${descripcion}</td>
              <td style="text-align:center; padding:4px 5px;"></td>
              <td style="text-align:right; padding:4px 5px;">$${montoLimpio.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            </tr>
          `;
        }
      });
      
      let totalOtrosIngresos = 0;
      let otrosIngresosDetalle = '';
      document.querySelectorAll('.bonificacion-row').forEach(row => {
        const descripcion = row.querySelector('.detalle-bonificacion')?.value?.trim();
        const montoStr = row.querySelector('.monto-bonificacion')?.value?.trim();
        const montoLimpio = parseCurrency(montoStr);
        if (descripcion && montoLimpio) {
          totalOtrosIngresos += montoLimpio;
          otrosIngresosDetalle += `
            <tr>
              <td style="padding:4px 5px;">${descripcion}</td>
              <td style="text-align:center; padding:4px 5px;">${fechaPago}</td>
              <td style="text-align:right; padding:4px 5px;">$${montoLimpio.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            </tr>
          `;
        }
      });
      
      const baseDeduccionesPanama = salarioOrdinario + montoExtra + montoFestivo;
      const deduccionCSS = Math.round(baseDeduccionesPanama * 0.0975 * 100) / 100;
      const deduccionSeguroEducativo = Math.round(baseDeduccionesPanama * 0.0125 * 100) / 100;
      
      let deduccionISR = 0;
      const salarioAnual = salario * 12;
      if (salarioAnual > 11000) {
        if (salarioAnual <= 50000) {
          const excesoAnual = salarioAnual - 11000;
          const isrAnual = excesoAnual * 0.15;
          deduccionISR = isrAnual / 12;
        } else {
          const excesoAnual = salarioAnual - 50000;
          const isrAnual = 5850 + (excesoAnual * 0.25);
          deduccionISR = isrAnual / 12;
        }
        deduccionISR = Math.round(deduccionISR * 100) / 100;
      }
      
      const totalDeduccionesLegales = deduccionCSS + deduccionSeguroEducativo + deduccionISR;
      const salarioBrutoTotal = salarioOrdinario + montoExtra + montoFestivo + totalOtrosIngresos;
      const salarioNeto = Math.round((salarioBrutoTotal - totalDeduccionesLegales - totalDeducciones) * 100) / 100;
      
      const resultadoHTML = `
        <div style="max-width:530px; margin:0 auto; font-family:'Segoe UI',sans-serif; background:#fff; border-radius:10px; border:1px solid #ccc; padding:32px 24px 28px 24px; box-shadow:0 2px 8px rgba(0,0,0,0.07); page-break-inside:avoid;">
          <div style="text-align:center; margin-bottom:18px;">
            <div style="font-size: 30px; font-weight: bold; color: #4B0082; margin-bottom: 8px;">OAKBERRY</div>
            <span style="font-size:22px; font-weight:700; color:#2f006e;">COMPROBANTE DE PAGO</span>
          </div>
          <table style="width:100%; margin-bottom:12px; border:none; font-size:15px;">
            <tr>
              <td style="font-weight:600;">Empresa:</td>
              <td>${empresa}</td>
            </tr>
            <tr>
              <td style="font-weight:600;">RUC:</td>
              <td>${cedulaEmpresa}</td>
            </tr>
            <tr>
              <td style="font-weight:600;">Colaborador:</td>
              <td>${nombreColab}</td>
            </tr>
            <tr>
              <td style="font-weight:600;">Cédula:</td>
              <td>${cedulaColab}</td>
            </tr>
            <tr>
              <td style="font-weight:600;">Fecha de pago:</td>
              <td>${fechaPago}</td>
            </tr>
          </table>
          <table style="width:100%; border-collapse:collapse; font-size:15px; margin-bottom:18px;">
            <thead>
              <tr style="background:#E9E4F3; color:#2f006e;">
                <th style="text-align:left; padding:6px 5px;">Concepto</th>
                <th style="text-align:center; padding:6px 5px;">Fecha</th>
                <th style="text-align:right; padding:6px 5px;">Monto</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style="padding:4px 5px;">Salario Ordinario (${diasLaborados.toFixed(2)} días)</td>
                <td style="text-align:center; padding:4px 5px;">${fechaPago}</td>
                <td style="text-align:right; padding:4px 5px;">$${salarioOrdinario.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
              </tr>
              ${horasExtra > 0 ? `<tr>
                <td style="padding:4px 5px;">Horas Extra (${horasExtra} hrs)</td>
                <td style="text-align:center; padding:4px 5px;">${fechaPago}</td>
                <td style="text-align:right; padding:4px 5px;">$${montoExtra.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
              </tr>` : ''}
              ${festivos > 0 ? `<tr>
                <td style="padding:4px 5px;">Día Festivo / Extra (${festivos} días)</td>
                <td style="text-align:center; padding:4px 5px;">${fechaPago}</td>
                <td style="text-align:right; padding:4px 5px;">$${montoFestivo.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
              </tr>` : ''}
              ${otrosIngresosDetalle}
              <tr>
                <td style="padding:4px 5px; font-weight:600; border-top:1px solid #bfaee5;">Salario bruto total</td>
                <td style="padding:4px 5px; border-top:1px solid #bfaee5;"></td>
                <td style="text-align:right; padding:4px 5px; font-weight:600; border-top:1px solid #bfaee5;">$${salarioBrutoTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
              </tr>
              <tr>
                <td style="padding:4px 5px;">CSS (9.75%)</td>
                <td style="text-align:center; padding:4px 5px;"></td>
                <td style="text-align:right; padding:4px 5px;">$${deduccionCSS.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
              </tr>
              <tr>
                <td style="padding:4px 5px;">Seguro Educativo (1.25%)</td>
                <td style="text-align:center; padding:4px 5px;"></td>
                <td style="text-align:right; padding:4px 5px;">$${deduccionSeguroEducativo.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
              </tr>
              ${deduccionISR > 0 ? `<tr>
                <td style="padding:4px 5px;">Impuesto sobre la Renta</td>
                <td style="text-align:center; padding:4px 5px;"></td>
                <td style="text-align:right; padding:4px 5px;">$${deduccionISR.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
              </tr>` : ''}
              ${deduccionesHTML}
              <tr>
                <td style="padding:4px 5px; font-weight:600; border-top:1px solid #bfaee5;">SALARIO NETO TOTAL</td>
                <td style="padding:4px 5px; border-top:1px solid #bfaee5;"></td>
                <td style="text-align:right; padding:4px 5px; font-weight:700; border-top:1px solid #bfaee5; color:#2f006e; font-size:16px;">$${salarioNeto.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
              </tr>
            </tbody>
          </table>
          <div style="margin-top: 20px;">
            <p><strong>Firma de recibido:</strong></p>
            <br><br>
          </div>
        </div>
      `;
      
      const resultadoDiv = document.getElementById("recibo");
      resultadoDiv.innerHTML = resultadoHTML;
      
      const nota = document.getElementById('nota').value;
      if (nota) {
        resultadoDiv.innerHTML += `<div style="text-align:left; margin-top:8px; padding:0 24px;"><strong>Nota:</strong> ${nota}</div>`;
      }
      
      resultadoDiv.style.display = "block";
      document.getElementById("botonPdf").style.display = "block";
      
      window.scrollTo({ top: document.getElementById("boleta").offsetTop - 20, behavior: 'smooth' });
    }

    function imprimirBoleta() {
      window.print();
    }

    function enviarBoleta() {
      const email = document.getElementById("correoEmpleado")?.value || "";
      const nombre = document.getElementById("nombre_envio")?.value || "";
      const htmlRaw = document.getElementById("recibo")?.outerHTML || "";

      if (!email || !htmlRaw || !nombre) {
        alert("❌ Faltan datos para enviar la boleta.");
        return;
      }

      if (!confirm(`¿Está seguro que desea enviar la boleta al correo: ${email}?`)) {
        return;
      }

      const styles = [...document.querySelectorAll("style")].map(s => s.innerHTML).join("\n");
      const htmlFinal = `
        <html>
          <head><style>${styles}</style></head>
          <body>${htmlRaw}</body>
        </html>
      `;

      const payload = {
        html: htmlFinal,
        nombre: nombre,
        email: email,
        asunto: `Comprobante de Pago - ${nombre}`,
        nombreArchivo: `Comprobante_${nombre}.pdf`,
        cuerpo: `Estimado/a ${nombre},\n\nAdjunto encontrarás tu comprobante de pago.\n\nSaludos,\nOakberry`
      };

      fetch(GOOGLE_APPS_SCRIPT_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
        },
        body: new URLSearchParams(payload),
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert("✅ Comprobante enviado exitosamente");
        } else {
          alert("❌ Error: " + (data.error || "Error desconocido"));
        }
      })
      .catch(err => {
        console.error("❌ Error:", err);
        alert("❌ Error al enviar la boleta");
      });
    }

    function enviarBooletaDirecta() {
      // Función alternativa para envío directo desde modal
      const email = document.getElementById("correoEmpleado")?.value || "";
      const nombre = document.getElementById("nombre_envio")?.value || "";
      
      if (!email) {
        // Solicitar email
        const emailIngresado = prompt(`Ingrese email para enviar comprobante de ${nombre}:`);
        if (!emailIngresado) return;
        document.getElementById("correoEmpleado").value = emailIngresado;
      }
      
      // Generar boleta primero
      const pais = document.getElementById('pais_modal').value;
      if (pais === 'cr') {
        generarBoletaCR();
      } else {
        generarBoletaPanama();
      }
      
      // Luego enviar
      setTimeout(() => {
        enviarBoleta();
      }, 500);
    }

    // Inicializar al cargar
    window.addEventListener('DOMContentLoaded', () => {
      cargarDatosDelModal();
      agregarDeduccion();
      agregarBonificacion();
